  <circle cx="8.5" cy="31.5" r="1.15" fill="#c4783a"/>
  <circle cx="31.5" cy="31.5" r="1.15" fill="#c4783a"/>
  <!-- monogram r -->
  <path d="M13.4 28.2V12h7.4c3.65 0 6 1.9 6 4.85 0 2.2-1.2 3.75-3.15 4.4L28.2 28.2h-3.5l-4.05-6.55h-3.55v6.55H13.4Zm3.4-9.35h3.7c1.95 0 3.1-1 3.1-2.45s-1.15-2.4-3.1-2.4h-3.7v4.85Z" fill="url(#copperR)"/>
