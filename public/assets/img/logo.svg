<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="rbitcoin">
  <defs>
    <linearGradient id="plate" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a3038"/>
      <stop offset="1" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="copperFrame" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8a65a"/>
      <stop offset="0.45" stop-color="#c4783a"/>
      <stop offset="1" stop-color="#8a4a22"/>
