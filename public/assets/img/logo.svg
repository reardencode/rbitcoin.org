<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="rbitcoin">
  <defs>
    <linearGradient id="iron" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a221c"/>
      <stop offset="1" stop-color="#100c0a"/>
    </linearGradient>
    <linearGradient id="deepCopper" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b06a3c"/>
      <stop offset="0.4" stop-color="#8b4a2b"/>
      <stop offset="1" stop-color="#4a2414"/>
    </linearGradient>
    <linearGradient id="rFill" x1="12" y1="30" x2="28" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4925a"/>
      <stop offset="0.55" stop-color="#8b4a2b"/>
      <stop offset="1" stop-color="#5c3018"/>
    </linearGradient>
    <radialGradient id="rivetGrad" cx="0.35" cy="0.3" r="0.7">
      <stop stop-color="#c4a06a"/>
      <stop offset="0.35" stop-color="#8b4a2b"/>
      <stop offset="0.7" stop-color="#3a1e12"/>
      <stop offset="1" stop-color="#1a100c"/>
    </radialGradient>
  </defs>
  <!-- outer copper flange -->
  <rect x="2" y="2" width="36" height="36" rx="3.5" fill="url(#iron)" stroke="url(#deepCopper)" stroke-width="2"/>
  <!-- inner iron plate -->
  <rect x="5.5" y="5.5" width="29" height="29" rx="2" fill="#0a0807" stroke="rgba(139,74,43,0.4)" stroke-width="1"/>
  <!-- rivets: outer ring -->
  <circle cx="7.2" cy="7.2" r="1.35" fill="url(#rivetGrad)"/>
  <circle cx="20" cy="6.4" r="1.15" fill="url(#rivetGrad)"/>
  <circle cx="32.8" cy="7.2" r="1.35" fill="url(#rivetGrad)"/>
  <circle cx="33.6" cy="20" r="1.15" fill="url(#rivetGrad)"/>
  <circle cx="32.8" cy="32.8" r="1.35" fill="url(#rivetGrad)"/>
  <circle cx="20" cy="33.6" r="1.15" fill="url(#rivetGrad)"/>
  <circle cx="7.2" cy="32.8" r="1.35" fill="url(#rivetGrad)"/>
  <circle cx="6.4" cy="20" r="1.15" fill="url(#rivetGrad)"/>
  <!-- monogram r -->
  <path d="M13.5 28.4V11.8h7.5c3.7 0 6.1 1.95 6.1 4.95 0 2.25-1.2 3.85-3.2 4.5l4.65 7.15h-3.55l-4.15-6.7h-3.65v6.7H13.5Zm3.45-9.5h3.75c2 0 3.15-1 3.15-2.5s-1.15-2.45-3.15-2.45h-3.75v4.95Z" fill="url(#rFill)"/>
