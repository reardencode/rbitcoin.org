<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 1000" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Cool Rearden steel — no orange/copper in the rail body -->
    <linearGradient id="railSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1e22"/>
      <stop offset="0.18" stop-color="#3a4048"/>
      <stop offset="0.4" stop-color="#8a929c"/>
      <stop offset="0.52" stop-color="#c0c6cc"/>
      <stop offset="0.65" stop-color="#6a727c"/>
      <stop offset="0.85" stop-color="#3a4048"/>
      <stop offset="1" stop-color="#141618"/>
    </linearGradient>
    <linearGradient id="tieWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2822"/>
      <stop offset="0.4" stop-color="#3a322a"/>
      <stop offset="1" stop-color="#1a1612"/>
    </linearGradient>
    <pattern id="ballast" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#141618"/>
      <circle cx="3" cy="4" r="1.1" fill="#2a2c30"/>
      <circle cx="9" cy="2" r="0.8" fill="#222428"/>
      <circle cx="11" cy="8" r="1.2" fill="#323438"/>
      <circle cx="5" cy="11" r="0.9" fill="#282a2e"/>
      <circle cx="1" cy="9" r="0.6" fill="#1e2024"/>
    </pattern>
  </defs>

  <!-- Quiet ballast bed -->
  <rect x="18" y="0" width="124" height="1000" fill="url(#ballast)" opacity="0.7"/>
  <rect x="18" y="0" width="124" height="1000" fill="#0c0e10" opacity="0.35"/>

  <!-- Crossties under the rails (dark timber, low contrast) -->
  <g opacity="0.9">
    <rect x="22" y="16" width="116" height="18" rx="1" fill="url(#tieWood)"/>
    <rect x="20" y="72" width="120" height="20" rx="1" fill="#2a2420"/>
    <rect x="24" y="132" width="112" height="17" rx="1" fill="url(#tieWood)"/>
    <rect x="21" y="188" width="118" height="19" rx="1" fill="#28221c"/>
    <rect x="23" y="248" width="114" height="18" rx="1" fill="url(#tieWood)"/>
    <rect x="20" y="306" width="120" height="20" rx="1" fill="#2c2620"/>
    <rect x="24" y="366" width="112" height="17" rx="1" fill="url(#tieWood)"/>
    <rect x="21" y="424" width="118" height="19" rx="1" fill="#26201a"/>
    <rect x="23" y="484" width="114" height="18" rx="1" fill="url(#tieWood)"/>
    <rect x="20" y="542" width="120" height="20" rx="1" fill="#2a2420"/>
    <rect x="24" y="604" width="112" height="17" rx="1" fill="url(#tieWood)"/>
    <rect x="21" y="662" width="118" height="19" rx="1" fill="#28221c"/>
    <rect x="23" y="722" width="114" height="18" rx="1" fill="url(#tieWood)"/>
    <rect x="20" y="780" width="120" height="20" rx="1" fill="#2c2620"/>
    <rect x="24" y="842" width="112" height="17" rx="1" fill="url(#tieWood)"/>
    <rect x="21" y="900" width="118" height="19" rx="1" fill="#26201a"/>
    <rect x="23" y="960" width="114" height="18" rx="1" fill="url(#tieWood)"/>
  </g>

  <!-- Spike plates sit on the ties, outside the rail foot (not over the head) -->
  <g fill="#2a2c30" opacity="0.85">
    <rect x="32" y="20" width="5" height="10"/><rect x="55" y="20" width="5" height="10"/>
    <rect x="100" y="20" width="5" height="10"/><rect x="123" y="20" width="5" height="10"/>
    <rect x="32" y="76" width="5" height="10"/><rect x="55" y="76" width="5" height="10"/>
    <rect x="100" y="76" width="5" height="10"/><rect x="123" y="76" width="5" height="10"/>
    <rect x="32" y="192" width="5" height="10"/><rect x="55" y="192" width="5" height="10"/>
    <rect x="100" y="192" width="5" height="10"/><rect x="123" y="192" width="5" height="10"/>
    <rect x="32" y="310" width="5" height="10"/><rect x="55" y="310" width="5" height="10"/>
    <rect x="100" y="310" width="5" height="10"/><rect x="123" y="310" width="5" height="10"/>
    <rect x="32" y="428" width="5" height="10"/><rect x="55" y="428" width="5" height="10"/>
    <rect x="100" y="428" width="5" height="10"/><rect x="123" y="428" width="5" height="10"/>
    <rect x="32" y="546" width="5" height="10"/><rect x="55" y="546" width="5" height="10"/>
    <rect x="100" y="546" width="5" height="10"/><rect x="123" y="546" width="5" height="10"/>
    <rect x="32" y="666" width="5" height="10"/><rect x="55" y="666" width="5" height="10"/>
    <rect x="100" y="666" width="5" height="10"/><rect x="123" y="666" width="5" height="10"/>
    <rect x="32" y="784" width="5" height="10"/><rect x="55" y="784" width="5" height="10"/>
    <rect x="100" y="784" width="5" height="10"/><rect x="123" y="784" width="5" height="10"/>
    <rect x="32" y="904" width="5" height="10"/><rect x="55" y="904" width="5" height="10"/>
    <rect x="100" y="904" width="5" height="10"/><rect x="123" y="904" width="5" height="10"/>
  </g>

  <!--
    Rails drawn LAST so nothing crosses on top of the running surface.
    T-profile: wide foot, narrow web, head with worn highlight.
  -->
  <!-- Left rail -->
  <rect x="38" y="0" width="16" height="1000" fill="#1a1c20"/>
  <rect x="40" y="0" width="12" height="1000" fill="url(#railSteel)"/>
  <rect x="43" y="0" width="6" height="1000" fill="#2a3038"/>
  <rect x="41" y="0" width="10" height="1000" fill="url(#railSteel)" opacity="0.95"/>
  <rect x="43.5" y="0" width="3.5" height="1000" fill="#d0d6dc" opacity="0.22"/>

  <!-- Right rail -->
  <rect x="106" y="0" width="16" height="1000" fill="#1a1c20"/>
  <rect x="108" y="0" width="12" height="1000" fill="url(#railSteel)"/>
  <rect x="111" y="0" width="6" height="1000" fill="#2a3038"/>
  <rect x="109" y="0" width="10" height="1000" fill="url(#railSteel)" opacity="0.95"/>
  <rect x="111.5" y="0" width="3.5" height="1000" fill="#c8ced4" opacity="0.2"/>

  <!-- Subtle dark weathering only (no orange oxide) -->
  <rect x="38" y="0" width="1.5" height="1000" fill="#0a0c0e" opacity="0.45"/>
  <rect x="52.5" y="0" width="1.5" height="1000" fill="#0a0c0e" opacity="0.35"/>
  <rect x="106" y="0" width="1.5" height="1000" fill="#0a0c0e" opacity="0.45"/>
  <rect x="120.5" y="0" width="1.5" height="1000" fill="#0a0c0e" opacity="0.35"/>
</svg>
